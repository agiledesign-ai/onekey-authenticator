<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 260 260"
  role="img"
  aria-labelledby="title desc">
  <title id="title">SecureKey six-facet token foreground</title>
  <desc id="desc">Transparent HarmonyOS adaptive icon foreground with a six-facet 3D token.</desc>

  <defs>
    <filter id="token-shadow" x="42" y="34" width="190" height="208" filterUnits="userSpaceOnUse">
      <feDropShadow dx="7" dy="12" stdDeviation="8" flood-color="#003EAE" flood-opacity="0.26" />
    </filter>
  </defs>

  <!-- 六个正面折面对应六位 TOTP；整组轻微旋转以形成专属轮廓。 -->
  <g transform="rotate(-3 130 130)" filter="url(#token-shadow)">
    <!-- 右下侧厚先绘制，保证正面覆盖关系稳定。 -->
    <path d="M133 57L193 91V161L133 198L72 163V93L133 57Z" fill="#74A4EE" />

    <!-- 正面基础轮廓。 -->
    <path d="M126 49L187 84V154L126 190L65 155V86L126 49Z" fill="#FFFFFF" />

    <!-- 六个连续折面按顺时针顺序排列。 -->
    <path d="M126 49L187 84L126 119L126 49Z" fill="#EDF5FF" />
    <path d="M187 84V154L126 119L187 84Z" fill="#D1E4FF" />
    <path d="M187 154L126 190V119L187 154Z" fill="#B5D3FF" />
    <path d="M126 190L65 155L126 119V190Z" fill="#D7E8FF" />
    <path d="M65 155V86L126 119L65 155Z" fill="#EAF3FF" />
    <path d="M65 86L126 49V119L65 86Z" fill="#FAFCFF" />

    <!-- 顶部短高光仅强化体积，不增加新的识别符号。 -->
    <path d="M126 49L187 84L179 89L126 59L73 90L65 86L126 49Z" fill="#FFFFFF" fill-opacity="0.92" />
  </g>
</svg>
