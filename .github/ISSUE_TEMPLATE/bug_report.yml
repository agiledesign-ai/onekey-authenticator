name: 缺陷报告
description: 报告可复现的 2FA验证器-工具问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 安全漏洞请不要公开提交，请按照 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: 版本或提交号
      placeholder: v1.0.5 或完整提交号
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与 HarmonyOS 版本
      placeholder: 设备型号、HarmonyOS 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供稳定、最小的复现路径。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 请先移除账号、密钥、验证码、二维码和其他私密信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，并确认这不是尚未修复的安全漏洞。
          required: true
