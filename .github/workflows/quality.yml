name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-audit:
    name: Source audit and contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run contract tests
        run: node --test tests/*.test.mjs

      - name: Run open-source boundary audit
        run: node scripts/open-source-audit.mjs

      - name: Check whitespace errors
        run: git show --check --format= HEAD
